aid: laelaps-ai
name: Laelaps AI
description: 'Laelaps AI is a Zurich- and UK-based autonomous security company building
  what it calls "the brain behind security" — a hardware-agnostic, fail-safe autonomy
  layer that unifies aerial, ground, and stationary robots together with a site''s
  existing fixed cameras into a single coordinated monitoring force. The platform pairs
  field foundational models and visual intelligence with multi-agent coordination so
  that critical infrastructure and commercial and defense sites can be watched continuously,
  incidents detected and triaged automatically, and robots dispatched to observe and
  deter without a human operator watching every screen. Founded by Dr. Sophia Belser
  (CEO), Dr. Maria "Mania" Stamatopoulou (CRO), and Rokas Bendikas (CTO), the company
  is backed by Speedinvest, Expeditions Fund, Florent Venture Partners, Fund F, ESA
  BIC Switzerland, and NVIDIA Inception. As of this profile Laelaps AI publishes a
  three-page corporate website and no public developer surface — no documentation,
  API reference, SDKs, or machine-readable API artifacts were found.'
