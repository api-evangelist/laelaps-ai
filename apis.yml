aid: laelaps-ai
name: Laelaps AI
description: 'Laelaps AI builds field intelligence for critical assets. Its system, LEA, combines autonomous
  embodied agents (AI-powered robots for site perimeter coverage), video monitoring agents that work on existing
  camera infrastructure, and fixed and mobile sensing systems under a control center layer that fuses their data
  into actionable intelligence for human operators; the company says one operator can then protect and operate
  multiple sites 24/7. Target sites include military bases, power grids, data centers, factories and hospitals,
  and the control layer supports encrypted, air-gapped on-premises hosting. Founded in 2025 by Dr. Sophia Belser
  (CEO), Dr. Mania Stamatopoulou (CRO) and Rokas Bendikas (CTO), Laelaps AI is based in Switzerland and operates
  across Europe; its site lists Speedinvest, Expeditions Fund, Florent Venture Partners, Fund F, ESA BIC and NVIDIA
  Inception as backers. It publishes a corporate website and an llms.txt but no public developer surface - no
  documentation, API reference, SDKs or machine-readable API artifacts.'
